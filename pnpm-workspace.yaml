packages:
  - packages/*
  - playgrounds/*

catalogs:
  build:
    tsdown: ^0.23.0
  hooks:
    '@commitlint/cli': ^21.2.3
    '@commitlint/config-conventional': ^21.2.3
    lint-staged: ^17.6.0
    simple-git-hooks: ^2.14.0
  lint:
    '@rhapsodic/eslint-config': ^5.0.0
    eslint: ^10.11.0
  release:
    bumpp: ^12.3.0
  test:
    '@vitest/coverage-v8': ^5.0.2
    tinybench: 6.2.0
    vitest: ^5.0.2
  types:
    typescript: ~6.0.3
  vue:
    '@vitejs/plugin-vue': ^6.0.9
    vite: ^8.3.1
    vue: ^3.5.43
    vue-tsc: ^3.3.11

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
