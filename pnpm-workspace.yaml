packages:
  - packages/*
  - playgrounds/*

catalogs:
  build:
    tsdown: ^0.23.1
  hooks:
    '@commitlint/cli': ^21.2.3
    '@commitlint/config-conventional': ^21.2.3
    lint-staged: ^17.6.0
    simple-git-hooks: ^2.14.0
  lint:
    '@rhapsodic/eslint-config': ^5.0.0
    eslint: ^10.13.0
  release:
    bumpp: ^12.3.0
  test:
    '@vitest/coverage-v8': ^5.0.5
    tinybench: 6.2.2
    vitest: ^5.0.5
  types:
    typescript: ~6.0.3
  vue:
    '@vitejs/plugin-vue': ^6.0.10
    vite: ^8.3.4
    vue: ^3.5.44
    vue-tsc: ^3.3.13

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
