packages:
  - packages/*
  - playgrounds/*

catalogs:
  build:
    tsdown: ^0.22.14
  hooks:
    '@commitlint/cli': ^21.2.2
    '@commitlint/config-conventional': ^21.2.2
    lint-staged: ^17.4.1
    simple-git-hooks: ^2.14.0
  lint:
    '@rhapsodic/eslint-config': ^5.0.0
    eslint: ^10.9.1
  release:
    bumpp: ^11.1.0
  test:
    '@vitest/coverage-v8': ^4.1.11
    tinybench: 6.1.4
    vitest: ^4.1.10
  types:
    typescript: ~6.0.3
  vue:
    '@vitejs/plugin-vue': ^6.0.8
    vite: ^7.3.6
    vue: ^3.5.42
    vue-tsc: ^3.3.11

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
