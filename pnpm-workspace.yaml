packages:
  - packages/*
  - playgrounds/*

catalogs:
  build:
    tsdown: ^0.22.14
  hooks:
    '@commitlint/cli': ^21.2.1
    '@commitlint/config-conventional': ^21.2.0
    lint-staged: ^17.2.0
    simple-git-hooks: ^2.13.1
  lint:
    '@rhapsodic/eslint-config': ^1.0.5
    eslint: ^10.7.0
  release:
    bumpp: ^11.1.0
  test:
    '@vitest/coverage-v8': ^4.1.10
    tinybench: 6.1.2
    vitest: ^4.1.10
  types:
    typescript: ~6.0.3
  vue:
    '@vitejs/plugin-vue': ^6.0.8
    vite: ^7.3.6
    vue: ^3.5.40
    vue-tsc: ^3.3.8

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
