packages:
  - packages/*
  - playgrounds/*

catalogs:
  build:
    tsdown: ^0.23.7
  hooks:
    '@commitlint/cli': ^21.2.4
    '@commitlint/config-conventional': ^21.2.4
    lint-staged: ^17.6.0
    simple-git-hooks: ^2.14.0
  lint:
    '@rhapsodic/eslint-config': ^5.0.0
    eslint: ^10.14.0
  release:
    bumpp: ^12.3.0
  test:
    '@vitest/coverage-v8': ^5.1.0
    tinybench: 6.2.3
    vitest: ^5.1.0
  types:
    typescript: ~6.0.3
  vue:
    '@vitejs/plugin-vue': ^6.0.10
    vite: ^8.3.6
    vue: ^3.5.45
    vue-tsc: ^3.3.14

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
